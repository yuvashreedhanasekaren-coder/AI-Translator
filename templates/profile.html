<!DOCTYPE html>
<html>
<head>
    <title>My Profile - AI Translator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 20%, rgba(184,115,51,0.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(120,53,15,0.28), transparent 30%),
        #1c1410;

    color:#f8f1e7;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

/* Profile Card */

.profile-card{
    width:460px;

    padding:38px;

    background:rgba(45,30,23,0.92);

    border:1px solid rgba(205,133,63,0.28);

    border-radius:24px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55),
        0 0 35px rgba(184,115,51,0.10);

    backdrop-filter:blur(15px);
}

/* Title */

.profile-title{
    text-align:center;

    font-size:28px;
    font-weight:700;

    margin-bottom:32px;

    color:#f5e6d3;
}

/* Profile Information */

.profile-item{
    margin-bottom:20px;
}

.profile-label{
    font-size:13px;

    font-weight:600;

    color:#c9a98b;

    margin-bottom:7px;

    letter-spacing:0.5px;
}

.profile-value{
    padding:14px 16px;

    border-radius:12px;

    background:#302019;

    border:1px solid rgba(205,133,63,0.18);

    color:#f8f1e7;

    font-size:15px;

    transition:0.25s ease;
}

.profile-value:hover{
    border-color:#c47a3a;

    transform:translateX(3px);

    box-shadow:
        0 5px 18px rgba(184,115,51,0.12);
}

/* Edit Button */

.edit-btn{
    width:100%;

    margin-top:10px;

    padding:14px;

    border:none;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        #b87333,
        #d8893f
    );

    color:#fffaf3;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(184,115,51,0.25);

    transition:0.3s ease;
}

.edit-btn:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        135deg,
        #c47a3a,
        #e09a52
    );

    box-shadow:
        0 12px 30px rgba(184,115,51,0.35);
}

/* Back Button */

.back-btn{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#c9a98b;

    text-decoration:none;

    font-size:14px;

    transition:0.25s ease;
}

.back-btn:hover{
    color:#e09a52;
}

/* Mobile */

@media(max-width:520px){

    body{
        padding:18px;
    }

    .profile-card{
        width:100%;

        padding:28px 22px;
    }

    .profile-title{
        font-size:24px;
    }
}
</style>
    </style>
</head>

<body>

<div class="profile-card">

    <div class="profile-title">
        👤 My Profile
    </div>

    <div class="profile-item">
        <div class="profile-label">Full Name</div>
        <div class="profile-value">{{ user["username"] }}</div>
    </div>

    <div class="profile-item">
        <div class="profile-label">Email</div>
        <div class="profile-value">{{ user["email"] }}</div>
    </div>

    <div class="profile-item">
        <div class="profile-label">Purpose</div>
        <div class="profile-value">{{ user["purpose"] or "Not provided" }}</div>
    </div>

    <a href="/edit-profile" class="edit-btn">
    ✏️ Edit Profile
</a>

    <a href="/home" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
