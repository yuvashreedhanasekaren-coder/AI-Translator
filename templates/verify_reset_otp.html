<!DOCTYPE html>
<html>
<head>
<title>Verify OTP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9966,#ff5e62,#845ec2,#4d96ff);
    background-size:400% 400%;
    animation:bgMove 12s infinite alternate;
}

@keyframes bgMove{
    0%{background-position:left;}
    100%{background-position:right;}
}

/* NEW CARD DESIGN */
.card{
    width:380px;
    padding:45px 35px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(25px);
    box-shadow:0 25px 60px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
    position:relative;
    overflow:hidden;
}

/* Decorative Circle */
.card::before{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-60px;
    right:-60px;
}

.card h1{
    font-size:24px;
    margin-bottom:10px;
}

.card p{
    font-size:14px;
    opacity:0.8;
    margin-bottom:25px;
}

/* OTP Input Style */
.otp-input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    text-align:center;
    letter-spacing:6px;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
    transition:0.3s;
}

.otp-input:focus{
    background:rgba(255,255,255,0.3);
    transform:scale(1.05);
}

/* Button */
.verify-btn{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    transition:0.3s;
}

.verify-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* Error Message */
.error{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:rgba(255,0,0,0.2);
    border:1px solid rgba(255,0,0,0.4);
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">
    <h1>🔑 Reset Authentication </h1>
    <p>Please enter the 6-digit OTP sent to your email</p>

    <form method="POST">
        <input type="text" name="otp" maxlength="6" class="otp-input" placeholder="______" required>
        <button type="submit" class="verify-btn">Confirm OTP</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</div>

</body>
</html>
