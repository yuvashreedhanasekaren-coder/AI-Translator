<!DOCTYPE html>
<html>
<head>
<title>Select Video Type</title>

<style>
body{

    font-family:Segoe UI,sans-serif;
    color:white;
}

.container{
    text-align:center;
}

button{
    padding:15px 35px;
    margin:15px;

    cursor:pointer;
    color:white;

button:hover{

}
/* Back button */
.back{
    position:fixed;
    bottom:20px;
    left:20px;
    width:auto;
    padding:10px 18px;
    background:#ef4444;

.back:hover{

}

</head>
<body>

    <h1>🎬 Select Video Translation Type</h1>

    <br>

    <br>

</div>

<a href="/home">

</html>
