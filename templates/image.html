<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Translation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #1d2671,
                #c33764,
                #845ec2,
                #4d96ff
            );
            background-size: 400% 400%;
            animation: bgMove 12s infinite alternate;
            color: white;
            padding: 30px 15px;
        }

        @keyframes bgMove {
            0% { background-position: left; }
            100% { background-position: right; }
        }

        .container {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            padding: 35px;
            border-radius: 20px;
            width: 360px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 25px;
        }

        .preview {
            margin: 20px 0;
        }

        .preview img {
            width: 250px;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .file-wrapper {
            display: flex;
            align-items: center;
            padding: 6px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            margin: 20px 0;
            min-width: 0;
        }

        .file-btn {
            background: white;
            color: #333;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-name {
            margin-left: 12px;
            font-size: 13px;
            opacity: 0.9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        label.language-label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #222;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(90deg, #6366f1, #22d3ee);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .error-message {
            color: white;
            background: rgba(185, 28, 28, 0.9);
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        /* Back Home: fixed at bottom-left */
        .back {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: auto;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;

            background: #ef4444;
            color: white;
            text-decoration: none;
            font-size: 15px;
            line-height: 1.4;
            transition: background 0.3s;
        }

        .back:hover {
            background: #dc2626;
        }

        @media (max-width: 420px) {
            .container {
                padding: 25px 20px;
            }

            body {
                flex-direction: column;
            }

            /* Keep Back Home fixed on mobile too */
            .back {
                position: fixed;
                bottom: 15px;
                left: 15px;
                margin-top: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖼️ Image Translation</h1>

        {% if error %}
            <div class="error-message" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <div class="preview">
            <img
                src="{{ url_for('static', filename='image_trans.jpg') }}"
                alt="Image Translation"
            >
        </div>

        <form
            id="imageForm"
            action="{{ url_for('image_page') }}"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                id="imageInput"
                name="image"
                accept="image/*"
                required
            >

            <div class="file-wrapper">
                <label for="imageInput" class="file-btn">
                    Choose File
                </label>

                <div class="file-name" id="fileName">
                    No file chosen
                </div>
            </div>

            <!-- <label for="target_lang" class="language-label">
                Translate into
            </label>  -->

            <select name="target_lang" id="target_lang" required>
                <option value="ta">Tamil</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
            </select>

            <button type="submit" id="translateButton">
                🌍 Translate Image
            </button>

        </form>

    </div>

    <!-- Outside the container so it stays at the screen corner -->
    <a href="{{ url_for('home') }}" class="back">
        ⬅ Back Home
    </a>

    <script>
        const input = document.getElementById("imageInput");
        const fileName = document.getElementById("fileName");
        const form = document.getElementById("imageForm");
        const translateButton = document.getElementById("translateButton");

        input.addEventListener("change", function () {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
            } else {
                fileName.textContent = "No file chosen";
            }
        });

        form.addEventListener("submit", function () {
            if (input.files.length > 0) {
                translateButton.disabled = true;
                translateButton.textContent = "⏳ Translating...";
            }
        });
    </script>

</body>
</html>
