<!DOCTYPE html>
<html>
<head>
<title>Live Translator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
radial-gradient(circle at 80% 70%, #06b6d4 0%, transparent 40%),
#0f172a;
}

/* MAIN BOX */
.box{
width:460px;
padding:35px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(25px);

border-radius:22px;
border:1px solid rgba(255,255,255,0.25);

box-shadow:
0 25px 60px rgba(0,0,0,0.35),
inset 0 1px 0 rgba(255,255,255,0.4);

color:white;
}

/* TITLE */
h2{
text-align:center;
margin-bottom:25px;
font-size:24px;
font-weight:600;
}

/* SELECT */
select{
width:100%;
padding:12px;
margin-top:12px;

border:none;
border-radius:10px;

background:rgba(255,255,255,0.85);
color:#1e293b;

font-size:14px;
outline:none;
}

/* BUTTON */
button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:14px;
font-weight:500;
transition:0.25s;
}

/* ROW BUTTONS */
.row{
display:flex;
gap:12px;
margin-top:14px;
}

.row button{
flex:1;
background:rgba(255,255,255,0.3);
color:white;
}

/* RESET */
.reset{
width:100%;
margin-top:12px;
background:rgba(255,255,255,0.3);
color:white;
}

/* OUTPUT BOX */
.output{
margin-top:15px;
padding:14px;
border-radius:12px;

background:rgba(255,255,255,0.85);
color:#1e293b;

min-height:60px;
}

/* GENERATE BUTTON */
.generate-btn{
display:block;
margin:18px auto 10px auto;
width:70%;

background:linear-gradient(135deg,#6366f1,#4f46e5);
color:white;
}

/* AUDIO */
audio{
width:100%;
margin-top:12px;
}

/* HOVER EFFECT */
button:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,0,0,0.25);
}

/* BACK BUTTON */
.back-btn{
position:fixed;
bottom:20px;
left:20px;

background:#ef4444;
color:white;

padding:10px 18px;
border-radius:10px;
text-decoration:none;
}

.back-btn:hover{
background:#dc2626;
}

.label{
font-size:13px;
margin-top:12px;
margin-bottom:5px;
opacity:0.8;
}
</style>

</head>

<body>

<div class="box">

<h2>🎤 Live Translator</h2>

<select id="input_language">
<option value="en-US">English</option>
<option value="ta-IN">Tamil</option>
<option value="te-IN">Telugu</option>
<option value="hi-IN">Hindi</option>
<option value="kn-IN">Kannada</option>
</select>

<select id="output_language">
<option value="en">English</option>
<option value="ta">Tamil</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="kn">Kannada</option>
</select>

<div class="row">
<button onclick="startRecognition()">Start</button>
<button onclick="stopRecognition()">Stop</button>
</div>

<button class="reset" onclick="refreshPage()">Reset</button>

<div class="label">📝 Original Text</div>
<div class="output" id="original"></div>

<div class="label">🌐 Translated Text</div>
<div class="output" id="translated"></div>

<button class="generate-btn" onclick="generateVoice()">Generate Audio</button>

<audio id="audioPlayer" controls></audio>

</div>

<a href="/home" class="back-btn">⬅ Back</a>

<script>

/* JS untouched */

let recognition;
let fullText="";
let timer;
let audioPlayer = document.getElementById("audioPlayer");
let audioReady=false;

function startRecognition(){
const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
recognition=new SR();
recognition.continuous=true;
recognition.interimResults=true;
recognition.lang = document.getElementById("input_language").value;

recognition.onresult=function(e){
let interim="",final="";

for(let i=e.resultIndex;i<e.results.length;i++){
if(e.results[i].isFinal){
final+=e.results[i][0].transcript+" ";
}else{
interim+=e.results[i][0].transcript;
}
}

if(final.trim()) fullText+=final;

document.getElementById("original").innerText = fullText+interim;

if(final.trim()){
clearTimeout(timer);

timer=setTimeout(()=>{
fetch("/live_translate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
text:fullText,
target_lang:document.getElementById("output_language").value
})
})
.then(r=>r.json())
.then(d=>{
document.getElementById("translated").innerText = d.translated;
});
},700);
}
};

recognition.start();
}

function stopRecognition(){
if(recognition) recognition.stop();
}

function generateVoice(){
let text = document.getElementById("translated").innerText;

if(!text){
alert("No translated text");
return;
}

fetch("/generate_voice",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
text:text,
lang:document.getElementById("output_language").value
})
})
.then(res=>res.json())
.then(data=>{
audioPlayer.src=data.audio_url;
audioReady=true;
alert("Audio Ready");
});
}

function playVoice(){
if(!audioReady){
alert("Generate first");
return;
}
audioPlayer.play();
}

function refreshPage(){
if(recognition) recognition.stop();
fullText="";
document.getElementById("original").innerText="";
document.getElementById("translated").innerText="";
}

</script>

</body>
</html>
