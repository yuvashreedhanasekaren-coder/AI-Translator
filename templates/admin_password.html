<!DOCTYPE html>
<html>
<head>
    <title>Admin Verification - AI Translator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(184,115,51,0.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(120,53,15,0.28),
                    transparent 30%
                ),
                #1c1410;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:30px;

            color:#f8f1e7;
        }

        .admin-card{
            width:440px;
            padding:40px;

            background:rgba(45,30,23,0.94);

            border:1px solid rgba(205,133,63,0.28);

            border-radius:24px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55),
                0 0 35px rgba(184,115,51,0.10);
        }

        .icon{
            text-align:center;
            font-size:48px;
            margin-bottom:15px;
        }

        .title{
            text-align:center;

            font-size:27px;
            font-weight:700;

            color:#f5e6d3;

            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;

            font-size:13px;
            color:#c9a98b;

            margin-bottom:28px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;

            font-size:13px;
            font-weight:600;

            color:#c9a98b;

            margin-bottom:7px;
        }

        input{
            width:100%;

            padding:13px 15px;

            border-radius:11px;

            border:1px solid rgba(205,133,63,0.18);

            background:#302019;

            color:#f8f1e7;

            font-size:14px;

            outline:none;
        }

        input:focus{
            border-color:#c47a3a;

            box-shadow:
                0 0 0 2px rgba(196,122,58,0.12);
        }

        .error{
            background:rgba(180,50,50,0.12);

            border:1px solid rgba(220,80,80,0.35);

            color:#ffb4a8;

            padding:12px 14px;

            border-radius:10px;

            font-size:13px;

            margin-bottom:20px;

            text-align:center;
        }

        .verify-btn{
            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:linear-gradient(
                135deg,
                #b87333,
                #d8893f
            );

            color:#fffaf3;

            font-size:15px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s ease;

            box-shadow:
                0 8px 25px rgba(184,115,51,0.25);
        }

        .verify-btn:hover{
            transform:translateY(-2px);

            box-shadow:
                0 12px 30px rgba(184,115,51,0.35);
        }

        .back-btn{
            display:block;

            text-align:center;

            margin-top:18px;

            color:#c9a98b;

            text-decoration:none;

            font-size:14px;
        }

        .back-btn:hover{
            color:#e09a52;
        }

        @media(max-width:520px){

            body{
                padding:18px;
            }

            .admin-card{
                width:100%;
                padding:30px 22px;
            }

            .title{
                font-size:24px;
            }
        }

    </style>
</head>

<body>

<div class="admin-card">

    <div class="icon">
        🛡️
    </div>

    <div class="title">
        Admin Verification
    </div>

    <div class="subtitle">
        Enter the administrator password to continue
    </div>

    {% if error %}
        <div class="error">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label>Admin Password</label>

            <input
                type="password"
                name="admin_password"
                placeholder="Enter admin password"
                required
            >

        </div>

        <button type="submit" class="verify-btn">
            🔐 Verify Admin
        </button>

    </form>

    <a href="/admin" class="back-btn">
        ← Back
    </a>

</div>

</body>
</html>
