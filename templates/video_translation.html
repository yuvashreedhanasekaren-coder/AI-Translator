<!DOCTYPE html>
<html>
<head>
<title>Video Translation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

/* Background */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#8e2de2,#c33764,#4d96ff);
    background-size:400% 400%;
    animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
    0%{background-position:left;}
    100%{background-position:right;}
}

/* Glass container */
.container{
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.12);
    padding:35px;
    border-radius:22px;
    width:400px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    color:white;
}

/* Title spacing */
h2{
    margin-bottom:25px;
    font-weight:600;
}

/* Hide default file input */
input[type="file"]{
    display:none;
}

/* SLIM FILE BAR */
.file-wrapper{
    display:flex;
    align-items:center;
    padding:6px;
    border-radius:40px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    margin-bottom:25px;   /* Proper space below */
}

/* Small pill button */
.file-btn{
    background:white;
    color:#333;
    padding:6px 16px;
    border-radius:30px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
}

/* File name */
.file-name{
    margin-left:14px;
    font-size:14px;
    font-weight:400;
    opacity:0.9;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* Select */
select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
}

/* Main button */
button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    background:linear-gradient(90deg,#6366f1,#22d3ee);
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
/* Download link */ 
.download{ display:block; 
    margin-top:15px; 
    color:#22d3ee;
     text-decoration:none; } 

.back-home-btn{ 
    position:fixed;
    bottom:20px;
    left:20px;
    padding:12px 22px;
    background:#22d3ee;
    color:black; 
    text-decoration:none; 
    border-radius:8px; 
    font-weight:bold; } 

.back-home-btn:hover{ 
    background:#0ea5e9; }
    
</style>
</head>

<body>

<div class="container">
    <h2>🎥 Video Translation</h2>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" id="videoInput" name="video" required>

        <div class="file-wrapper">
            <label for="videoInput" class="file-btn">
                Choose File
            </label>
            <div class="file-name" id="fileName">
                No file chosen
            </div>
        </div>

        <select name="language">
            <option value="ta">Tamil</option>
            <option value="en">English</option>
            <option value="te">Telugu</option>
            <option value="kn">Kannada</option>
        </select>

        <button type="submit">🌍 Translate Video</button>
    </form>

    {% if output %} <a class="download" 
    href="{{ url_for('download_file', filename=output) }}"> 
    ⬇ Download Translated Video </a> {% endif %}
</div>

<a href="/video" class="back-home-btn"> ⬅ Back </a>

<script>
const input = document.getElementById("videoInput");
const fileName = document.getElementById("fileName");

input.addEventListener("change", function(){
    if(this.files.length > 0){
        fileName.textContent = this.files[0].name;
    } else {
        fileName.textContent = "No file chosen";
    }
});
</script>

</body>
</html>
